<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - SMAN Banua Kalsel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="navbar">
            <div class="logo-area">
                <img src="assets/banua.png" alt="Logo SMAN Banua Kalsel">
                <span class="school-name">SMAN Banua Kalsel</span>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="jurusan.html">Jurusan</a></li>
                    <li><a href="kontak.html">Kontak</a></li>
                </ul>
            </nav>
        </div>
        <div class="hero-banner">
            <h1>Hubungi Kami</h1>
            <p>Kami siap membantu dan menjawab pertanyaan Anda</p>
        </div>
    </header>

    <main>
        <section>
            <h2>Kirim Pesan</h2>
            <form action="#" method="POST">
                <label for="nama">Nama:</label><br>
                <input type="text" id="nama" name="nama" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="pesan">Pesan:</label><br>
                <textarea id="pesan" name="pesan" rows="5" cols="40" required></textarea><br><br>

                <button type="submit">Kirim Pesan</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SMAN Banua Kalsel. All rights reserved.</p>
    </footer>
</body>
</html>
