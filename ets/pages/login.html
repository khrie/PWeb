<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LibraryReg</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-wrapper">
            <a href="../index.html" class="brand-title">LibraryReg</a>
            <nav class="nav-links">
                <a href="../index.html">Beranda</a>
                <a href="login.html" class="active">Login</a>
                <a href="register.html">Register</a>
                <a href="anggota.html">Anggota</a>
            </nav>
        </div>
    </header>

    <main class="container auth-wrapper">
        <div class="card auth-card">
            <h3 class="text-center">Masuk ke Akun</h3>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="nama@email.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password:</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Minimal 6 karakter" required>
                </div>

                <div class="form-group">
                    <label style="font-size: 14px; font-weight: normal;">
                        <input type="checkbox" id="rememberMe"> Ingat Saya
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Masuk</button>

                <div class="text-center mt-2">
                    <p style="font-size: 13px;">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
                    <p style="font-size: 13px;"><a href="../index.html">&larr; Kembali ke Beranda</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 LibraryReg - Perpustakaan Perguruan Tinggi</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
