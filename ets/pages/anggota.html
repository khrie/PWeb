<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Anggota - LibraryReg</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-wrapper">
            <a href="../index.html" class="brand-title">LibraryReg</a>
            <nav class="nav-links">
                <a href="../index.html">Beranda</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
                <a href="anggota.html" class="active">Anggota</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <div id="editCard" class="card" style="display: none;">
            <h3>Edit Data Anggota</h3>
            <form id="editForm">
                <input type="hidden" id="editIndex" value="-1">

                <div class="form-group">
                    <label for="editNim">NIM / NIP:</label>
                    <input type="text" id="editNim" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="editNama">Nama Lengkap:</label>
                    <input type="text" id="editNama" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="editJenis">Jenis Keanggotaan:</label>
                    <select id="editJenis" class="form-control" required>
                        <option value="">-- Pilih Jenis --</option>
                        <option value="Mahasiswa">Mahasiswa</option>
                        <option value="Dosen">Dosen</option>
                        <option value="Tenaga Kependidikan">Tenaga Kependidikan</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editProdi">Program Studi / Unit:</label>
                    <input type="text" id="editProdi" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="editAlamat">Alamat:</label>
                    <input type="text" id="editAlamat" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="editTelepon">Nomor Telepon:</label>
                    <input type="text" id="editTelepon" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="editEmail">Email:</label>
                    <input type="email" id="editEmail" class="form-control" required>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                    <button type="button" id="btnCancelEdit" class="btn btn-secondary">Batal</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h3>Daftar Anggota Perpustakaan</h3>

            <div class="form-group">
                <input type="text" id="searchInput" class="form-control" placeholder="Ketik untuk mencari nama atau NIM/NIP...">
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>NIM/NIP</th>
                            <th>Nama</th>
                            <th>Jenis</th>
                            <th>Prodi</th>
                            <th>Alamat</th>
                            <th style="min-width: 120px;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="mhsTableBody">

                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 LibraryReg - Perpustakaan Perguruan Tinggi</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
