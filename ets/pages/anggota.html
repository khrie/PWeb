<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anggota - Portal Mahasiswa</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-wrapper">
            <a href="../index.html" class="brand-title">LibraryReg</a>
            <nav class="nav-links">
                <a href="../index.html">Beranda</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
                <a href="anggota.html">Anggota</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="row-2">
            
            <div class="col-form">
                <div class="card">
                    <h3>Tambah Data Mahasiswa</h3>
                    
                    <form id="mhsForm">
                        <div class="form-group">
                            <label for="nim">NIM:</label>
                            <input type="text" id="nim" class="form-control" placeholder="Contoh: 5025251066" required>
                        </div>

                        <div class="form-group">
                            <label for="nama">Nama Lengkap:</label>
                            <input type="text" id="nama" class="form-control" placeholder="Contoh: Nabil Khairie" required>
                        </div>

                        <div class="form-group">
                            <label for="jurusan">Jurusan:</label>
                            <select id="jurusan" class="form-control" required>
                                <option value="">-- Pilih Jurusan --</option>
                                <option value="Teknik Informatika">Teknik Informatika</option>
                                <option value="Sistem Informasi">Sistem Informasi</option>
                                <option value="Teknik Komputer">Teknik Komputer</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Simpan Data</button>
                    </form>
                </div>
            </div>

            <div class="col-table">
                <div class="card">
                    <h3>Daftar Mahasiswa</h3>
                    
                    <div class="form-group">
                        <input type="text" id="searchInput" class="form-control" placeholder="Ketik untuk mencari nama...">
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>NIM</th>
                                <th>Nama</th>
                                <th>Jurusan</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="mhsTableBody">
                            <tr>
                                <td>5025251066</td>
                                <td>Nabil Khairie</td>
                                <td>Teknik Informatika</td>
                                <td><button type="button" class="btn btn-danger btn-delete">Hapus</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="../js/app.js"></script>
</body>
</html>
