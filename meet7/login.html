<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun - Portal Akademik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="d-none d-md-flex col-md-4 col-lg-6 col-xl-7 bg-image"></div>

            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="login-container">
                    <div class="login-form-wrapper">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <a href="index.html" class="text-decoration-none text-muted small">&larr; Kembali ke Beranda</a>
                            <a href="register.html" class="text-decoration-none text-primary small fw-semibold">Daftar Akun &rarr;</a>
                        </div>

                        <h2 class="login-heading">Welcome back!</h2>

                        <div id="loginAlert" class="alert alert-success d-none mb-3"></div>

                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <input type="email" class="form-control form-control-lg" id="loginEmail" placeholder="Email address" required>
                                <div class="invalid-feedback">Masukkan alamat email yang valid.</div>
                            </div>

                            <div class="mb-3">
                                <div class="input-group">
                                    <input type="password" class="form-control form-control-lg" id="loginPassword" placeholder="Password" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">Tampilkan</button>
                                    <div class="invalid-feedback">Kata sandi minimal 6 karakter.</div>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="rememberPassword">
                                <label class="form-check-label text-secondary small" for="rememberPassword">
                                    Remember password
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold text-uppercase py-3 mb-3">
                                Sign In
                            </button>

                            <div class="text-center">
                                <a href="#" id="forgotPasswordLink" class="text-decoration-none text-muted small">Forgot password?</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Reset Kata Sandi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="forgotPasswordForm">
                    <div class="modal-body">
                        <p class="text-muted small">Masukkan email akun Anda. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi.</p>
                        <div class="mb-3">
                            <input type="email" class="form-control" id="resetEmail" placeholder="nama@mahasiswa.ac.id" required>
                        </div>
                        <div id="resetAlert" class="alert alert-success d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary btn-sm">Kirim Tautan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
